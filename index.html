<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo-List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>todo-list</h2>
    <br>
    <input type="text" id="task" placeholder="enter a task" autocomplete="off">
    <button id="addbtn">add</button>
    <div class="showtask">
      <ul class="ultasks">
      </ul>
      <p id="numtask">tasks : 0</p>
      <p id="comtask">completed : 0</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
